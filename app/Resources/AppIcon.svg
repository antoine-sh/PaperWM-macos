<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of AppIcon.icns: render at 1024x1024 with a transparent background, then save as .icns (e.g. Pillow). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b2a85" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#tile)">
    <!-- Neighbouring columns peeking in from the edges of the strip -->
    <rect x="-20" y="300" width="230" height="420" rx="36" fill="#ffffff" opacity="0.6"/>
    <rect x="814" y="300" width="230" height="420" rx="36" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- The focused column, a happy sheet of paper -->
  <g filter="url(#shadow)">
    <path d="M318 236 h320 l74 74 v442 a36 36 0 0 1 -36 36 h-358 a36 36 0 0 1 -36 -36 v-480 a36 36 0 0 1 36 -36 z"
          fill="url(#paper)"/>
    <!-- Folded corner -->
    <path d="M638 236 v46 a28 28 0 0 0 28 28 h46 z" fill="#d9d0ff"/>
  </g>

  <!-- Face -->
  <ellipse cx="430" cy="500" rx="26" ry="34" fill="#3b2a85"/>
  <ellipse cx="594" cy="500" rx="26" ry="34" fill="#3b2a85"/>
  <circle cx="439" cy="488" r="9" fill="#ffffff"/>
  <circle cx="603" cy="488" r="9" fill="#ffffff"/>
  <ellipse cx="380" cy="568" rx="34" ry="20" fill="#ff9fc2" opacity="0.75"/>
  <ellipse cx="644" cy="568" rx="34" ry="20" fill="#ff9fc2" opacity="0.75"/>
  <path d="M478 566 q34 36 68 0" fill="none" stroke="#3b2a85" stroke-width="16" stroke-linecap="round"/>

  <!-- Little scroll arrows -->
  <path d="M256 512 l-34 -34 M256 512 l-34 34" fill="none" stroke="#7a62e0" stroke-width="18" stroke-linecap="round" opacity="0.8"
        transform="translate(-20 0) rotate(180 239 512)"/>
  <path d="M802 512 l-34 -34 M802 512 l-34 34" fill="none" stroke="#7a62e0" stroke-width="18" stroke-linecap="round" opacity="0.8"
        transform="translate(20 0)"/>
</svg>
