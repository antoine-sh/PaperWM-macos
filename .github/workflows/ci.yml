name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: |
          cargo clippy --locked --all-targets --target aarch64-apple-darwin -- -D warnings
          cargo clippy --locked --all-targets --target x86_64-apple-darwin -- -D warnings

      - name: Test engine
        run: cargo test --locked

      - name: Build app
        run: scripts/build-app.sh --universal

      - name: Package disk image
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PaperWM-dmg
          path: build/PaperWM-*.dmg
          if-no-files-found: error
