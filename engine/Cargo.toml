[package]
name = "paperwm-engine"
version = "1.0.0"
edition = "2021"
description = "Window-management engine for PaperWM on macOS"
publish = false

[lib]
name = "paperwm_engine"
# staticlib is linked into the Swift app; rlib is used by Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
